<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vereinsabrechnung</title>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    :root {
      --primary-color: #1a365d;
      --secondary-color: #2b6cb0;
      --background-color: #f7fafc;
      --card-background: #ffffff;
      --text-color: #2d3748;
      --border-color: #e2e8f0;
      --error-color: #e53e3e;
      --success-color: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--background-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 16px;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    header img {
      max-height: 40px;
      max-width: 100px;
      object-fit: contain;
    }

    form {
      background-color: var(--card-background);
      padding: 20px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      border-top: none;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #4a5568;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      background-color: #fff;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
    }

    .signature-container {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #fff;
      position: relative;
      margin-top: 6px;
    }

    canvas {
      width: 100%;
      height: 160px;
      display: block;
      border-radius: 6px;
      touch-action: none;
    }

    .clear-btn {
      position: absolute;
      right: 8px;
      top: 8px;
      background: #edf2f7;
      border: 1px solid #cbd5e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .preview-container {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preview-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .legal-notice {
      font-size: 0.75rem;
      color: #718096;
      margin: 16px 0;
      background-color: #edf2f7;
      padding: 10px;
      border-radius: 6px;
      border-left: 3px solid var(--secondary-color);
    }

    button[type="submit"] {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
      background-color: var(--secondary-color);
    }

    button[type="submit"]:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }

    .status-msg {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
      font-size: 0.9rem;
    }

    .status-msg.error {
      background-color: #fed7d7;
      color: #9b2c2c;
      border: 1px solid #feb2b2;
      display: block;
    }

    .status-msg.success {
      background-color: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Logo" id="clubLogo" onerror="this.style.display='none'">
    <h1>Vereinsabrechnung</h1>
  </header>

  <form id="receiptForm">
    <div id="statusBox" class="status-msg"></div>

    <div class="form-group">
      <label for="category">Art der Abrechnung *</label>
      <select id="category" required>
        <option value="Abrechnung Gasttrainer">Abrechnung Gasttrainer</option>
        <option value="Abrechnung Trainingsleistung">Abrechnung Trainingsleistung</option>
        <option value="Auslagenerstattung">Auslagenerstattung</option>
        <option value="Sonstiges">Sonstiges</option>
      </select>
    </div>

    <div class="form-group">
      <label for="trainerName">Name Antragsteller / Person *</label>
      <input type="text" id="trainerName" required placeholder="Vor- und Nachname">
    </div>

    <div class="form-group">
      <label for="trainerAddress">Anschrift *</label>
      <textarea id="trainerAddress" rows="2" required placeholder="Straße, PLZ, Ort"></textarea>
    </div>

    <div class="form-group">
      <label for="trainerIban">IBAN für Auszahlung *</label>
      <input type="text" id="trainerIban" required placeholder="DE00 0000 0000 0000 0000 00">
    </div>

    <div class="form-group">
      <label for="trainerBic">BIC / Kreditinstitut (optional)</label>
      <input type="text" id="trainerBic" placeholder="z. B. Sparkasse">
    </div>

    <div class="form-group">
      <label for="date">Datum der Leistung / Auslage *</label>
      <input type="date" id="date" required>
    </div>

    <div class="form-group">
      <label for="contactPerson">Übungsleiter / Ansprechpartner *</label>
      <input type="text" id="contactPerson" required placeholder="Name des Verantwortlichen">
    </div>

    <div class="form-group">
      <label for="purpose">Verwendungszweck / Beschreibung *</label>
      <input type="text" id="purpose" required placeholder="z. B. Materialkauf, Vertretung, Workshop">
    </div>

    <div class="form-group">
      <label for="amount">Auszahlungsbetrag (€) *</label>
      <input type="number" id="amount" step="0.01" min="0" required placeholder="0.00">
    </div>

    <div class="form-group">
      <label for="attachment">Anhang / Foto beifügen (Beleg, Foto, Rechnung)</label>
      <input type="file" id="attachment" accept="image/*,application/pdf" capture="environment">
      <div class="preview-container" id="previewContainer"></div>
    </div>

    <div class="form-group">
      <label>Unterschrift *</label>
      <div class="signature-container">
        <canvas id="signaturePad"></canvas>
        <button type="button" class="clear-btn" id="clearSignature">Löschen</button>
      </div>
    </div>

    <div class="legal-notice">
      Mit meiner Unterschrift bestätige ich die Richtigkeit aller Angaben sowie die ordnungsgemäße Erbringung der Leistung bzw. Entstehung der Auslagen. Ich fordere den Verein auf, den Betrag auf die oben genannte Bankverbindung zu überweisen.
    </div>

    <button type="submit" id="submitBtn">Abrechnung einreichen</button>
  </form>

  <script>
    // =========================================================================
    // HIER DEINE GOOGLE WEB-APP URL EINTRAGEN:
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/DEINE_WEB_APP_URL_HIER/exec";
    // =========================================================================

    // Datum auf heute vorbelegen
    document.getElementById('date').valueAsDate = new Date();

    // Canvas & SignaturePad Initialisierung
    const canvas = document.getElementById('signaturePad');
    const signaturePad = new SignaturePad(canvas, {
      backgroundColor: 'rgb(255, 255, 255)',
      penColor: 'rgb(0, 0, 128)'
    });

    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    document.getElementById('clearSignature').addEventListener('click', () => {
      signaturePad.clear();
    });

    // Vorschau für Anhang
    let attachmentBase64 = '';
    let attachmentFileName = '';

    document.getElementById('attachment').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const previewContainer = document.getElementById('previewContainer');
      previewContainer.innerHTML = '';

      if (file) {
        attachmentFileName = file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
          attachmentBase64 = evt.target.result;
          if (file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = evt.target.result;
            img.className = 'preview-img';
            previewContainer.appendChild(img);
          } else {
            previewContainer.textContent = '📄 Datei ausgewählt: ' + file.name;
          }
        };
        reader.readAsDataURL(file);
      }
    });

    // Formular Absenden
    const form = document.getElementById('receiptForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = `status-msg ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (signaturePad.isEmpty()) {
        showStatus('Bitte trage eine Unterschrift ein.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Wird gesendet...';
      statusBox.className = 'status-msg';

      const payload = {
        category: document.getElementById('category').value,
        trainerName: document.getElementById('trainerName').value,
        trainerAddress: document.getElementById('trainerAddress').value,
        trainerIban: document.getElementById('trainerIban').value,
        trainerBic: document.getElementById('trainerBic').value,
        date: document.getElementById('date').value,
        contactPerson: document.getElementById('contactPerson').value,
        purpose: document.getElementById('purpose').value,
        amount: document.getElementById('amount').value,
        signature: signaturePad.toDataURL('image/png'),
        attachment: attachmentBase64,
        attachmentName: attachmentFileName
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload)
        });

        showStatus('Abrechnung erfolgreich eingereicht! PDF und Anhang wurden versendet.', 'success');
        form.reset();
        signaturePad.clear();
        attachmentBase64 = '';
        attachmentFileName = '';
        document.getElementById('previewContainer').innerHTML = '';
        document.getElementById('date').valueAsDate = new Date();
      } catch (err) {
        showStatus('Fehler beim Senden: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Abrechnung einreichen';
      }
    });
  </script>
</body>
</html>
